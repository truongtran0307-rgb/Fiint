<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng ký thử sự kiện</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#111925;color:#eef4fc;font:16px/1.5 system-ui,sans-serif}main{max-width:460px;margin:32px auto;padding:26px;border:1px solid #34485e;border-radius:18px;background:#1b2838}h1{margin:0;line-height:1.2;overflow-wrap:anywhere}p{color:#bdcce0;overflow-wrap:anywhere}label{display:grid;gap:6px;margin:16px 0}input,button{min-height:46px;border-radius:9px;font:inherit;padding:8px 12px}input{background:#111925;color:white;border:1px solid #657c96;width:100%}button{width:100%;border:0;background:#80dfc5;color:#102725;font-weight:700;cursor:pointer}:focus-visible{outline:2px solid #b5fff0;outline-offset:3px}
</style>
</head>
<body><main><h1>{{title}}</h1>{{content}}</main></body>
</html>
